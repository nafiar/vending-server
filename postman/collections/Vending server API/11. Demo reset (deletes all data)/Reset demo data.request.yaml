$kind: http-request
description: Only when the server runs with DEMO_MODE=true. Deletes every row and loads the demo data again; the machine keys of VM-01 to VM-03 stay the same. Everyone is logged out.
url: "{{baseUrl}}/api/admin/demo/reset"
method: POST
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000

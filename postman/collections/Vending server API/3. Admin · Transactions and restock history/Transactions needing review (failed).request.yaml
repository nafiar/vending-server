$kind: http-request
description: "flag=problem: failed sales. flag=reported: 'Produk tidak keluar?' reports."
url: "{{baseUrl}}/api/admin/transactions?from={{from90}}&to={{today}}&flag=problem&page=1&pageSize=25"
method: GET
queryParams:
  from: "{{from90}}"
  to: "{{today}}"
  flag: problem
  page: "1"
  pageSize: "25"
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000

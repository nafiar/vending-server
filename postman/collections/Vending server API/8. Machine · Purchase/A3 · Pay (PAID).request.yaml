$kind: http-request
description: Simulated QRIS. Refused with EXPIRED 410 after 60 s (BR-06). The answer carries slotNumber, the coil the agent turns.
url: "{{baseUrl}}/api/machine/transactions/{{txId}}/pay"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('PAID', () => pm.expect(pm.response.json().status).to.eql('PAID'));
    language: text/javascript
order: 5000

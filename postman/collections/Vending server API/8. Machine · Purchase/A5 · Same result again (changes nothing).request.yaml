$kind: http-request
description: "TC-08 / NFR-03: a repeated result is answered with the current state; a different result gets CONFLICT 409."
url: "{{baseUrl}}/api/machine/transactions/{{txId}}/result"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "DISPENSED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('still DISPENSED', () => pm.expect(pm.response.json().status).to.eql('DISPENSED'));
    language: text/javascript
order: 7000

$kind: http-request
description: reason TIMEOUT marks it EXPIRED instead (the kiosk's 60 s countdown).
url: "{{baseUrl}}/api/machine/transactions/{{txId}}/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "CANCEL"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('CANCELLED', () => pm.expect(pm.response.json().status).to.eql('CANCELLED'));
    language: text/javascript
order: 10000

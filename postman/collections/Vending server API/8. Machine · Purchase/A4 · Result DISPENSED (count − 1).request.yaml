$kind: http-request
url: "{{baseUrl}}/api/machine/transactions/{{txId}}/result"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "DISPENSED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('DISPENSED', () => pm.expect(pm.response.json().status).to.eql('DISPENSED'));
    language: text/javascript
order: 6000

$kind: http-request
description: The kiosk makes the id (UUID), so a resend never creates a second sale. SOLD_OUT 409 when the slot has nothing left.
url: "{{baseUrl}}/api/machine/transactions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{txId}}",
      "slotNumber": {{slotNumber}},
      "catalogVersion": {{catalogVersion}}
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('txId', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: pm.test('status 200 or 201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 3000

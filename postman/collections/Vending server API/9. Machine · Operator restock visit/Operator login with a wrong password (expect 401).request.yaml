$kind: http-request
description: Five wrong passwords lock the account for 5 minutes (LOCKED 423). A correct login resets the counter.
url: "{{baseUrl}}/api/machine/operator/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{operatorUsername}}",
      "password": "salah-password"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 401', () => pm.response.to.have.status(401));
      pm.test('error code INVALID_LOGIN', () => pm.expect(pm.response.json().code).to.eql('INVALID_LOGIN'));
      pm.test('attempts left', () => pm.expect(pm.response.json()).to.have.property('attemptsLeft'));
    language: text/javascript
order: 1000

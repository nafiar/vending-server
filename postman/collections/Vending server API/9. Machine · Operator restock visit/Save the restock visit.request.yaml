$kind: http-request
description: "One visit: counts set, planned products applied, blocks cleared, catalog version + 1. The body is rebuilt from the previous request; a count outside 0–capacity gives INVALID_INPUT 422 with a field per slot. Resending the same id saves it once."
url: "{{baseUrl}}/api/machine/restock-sessions"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{operatorToken}}
body:
  type: json
  content: |-
    {
      "id": "{{restockId}}",
      "note": "Restock dari Postman",
      "items": [
        {
          "slotNumber": 1,
          "qtyAfter": 10
        }
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('restockId', pm.variables.replaceIn('{{$guid}}'));
      const items = JSON.parse(pm.collectionVariables.get('restockItems') || '[]');
      pm.request.body.raw = JSON.stringify({ id: pm.collectionVariables.get('restockId'), note: 'Restock dari Postman', items: items }, null, 2);
    language: text/javascript
  - type: afterResponse
    code: pm.test('status 200 or 201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
    language: text/javascript
order: 4000

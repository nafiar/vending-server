$kind: http-request
url: "{{baseUrl}}/api/admin/audit-logs?from={{from30}}&to={{today}}"
method: GET
queryParams:
  from: "{{from30}}"
  to: "{{today}}"
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000

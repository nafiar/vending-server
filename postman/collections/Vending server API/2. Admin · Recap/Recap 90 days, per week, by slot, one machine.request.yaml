$kind: http-request
description: machineId comes from '5. Admin · Machines and slots › List machines'. Empty = all machines.
url: "{{baseUrl}}/api/admin/recap?from={{from90}}&to={{today}}&machineId={{vm01Id}}&groupBy=week&breakdown=slot"
method: GET
queryParams:
  from: "{{from90}}"
  to: "{{today}}"
  machineId: "{{vm01Id}}"
  groupBy: week
  breakdown: slot
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000

$kind: http-request
url: "{{baseUrl}}/api/admin/recap?from={{from30}}&to={{today}}&groupBy=day&breakdown=product"
method: GET
queryParams:
  from: "{{from30}}"
  to: "{{today}}"
  groupBy: day
  breakdown: product
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('totals present', () => pm.expect(j).to.have.property('totals'));
    language: text/javascript
order: 2000

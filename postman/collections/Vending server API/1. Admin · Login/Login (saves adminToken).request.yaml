$kind: http-request
description: INVALID_LOGIN 401 for a wrong password, LOCKED 423 after 5 wrong tries (5 minutes), FORBIDDEN 403 for an operator account.
url: "{{baseUrl}}/api/admin/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{adminUsername}}",
      "password": "{{adminPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.collectionVariables.set('adminToken', j.token);
      pm.test('token saved', () => pm.expect(j.token).to.be.a('string').and.not.empty);
    language: text/javascript
order: 1000

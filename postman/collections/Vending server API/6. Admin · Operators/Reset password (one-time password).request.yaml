$kind: http-request
url: "{{baseUrl}}/api/admin/operators/{{operatorId}}/reset-password"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('temporary password', () => pm.expect(pm.response.json().temporaryPassword).to.be.a('string'));
    language: text/javascript
order: 3000

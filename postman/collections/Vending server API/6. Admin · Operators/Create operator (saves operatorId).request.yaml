$kind: http-request
url: "{{baseUrl}}/api/admin/operators"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Operator Postman",
      "username": "{{newOperatorUsername}}",
      "password": "rahasia123"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('newOperatorUsername', 'pm' + Math.floor(Math.random() * 90000 + 10000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status 200 or 201', () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const j = pm.response.json();
      pm.collectionVariables.set('operatorId', j.id || (j.user && j.user.id));
    language: text/javascript
order: 2000

$kind: http-request
url: "{{agentUrl}}/api/operator/slots"
method: GET
headers:
  Authorization: Bearer {{operatorToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      const items = (j.slots || []).map(s => ({
        slotNumber: s.slotNumber,
        qtyBefore: s.qty,
        qtyAfter: (s.product || s.nextProduct) ? s.capacity : s.qty
      }));
      pm.collectionVariables.set('restockItems', JSON.stringify(items));
    language: text/javascript
order: 2000

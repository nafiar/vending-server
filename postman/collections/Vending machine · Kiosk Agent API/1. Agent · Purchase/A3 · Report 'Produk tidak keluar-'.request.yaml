$kind: http-request
name: A3 · Report 'Produk tidak keluar?'
description: "Within 60 s of the sale. Answer: { id, reported: true }."
url: "{{agentUrl}}/api/transactions/{{txId}}/report"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000

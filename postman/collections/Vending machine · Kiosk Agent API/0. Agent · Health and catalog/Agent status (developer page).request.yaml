$kind: http-request
description: "What the /dev/ page shows: server state, simulator mode, journal entries, last vends. Switch the simulator (OK, Jam, No echo, power cut) on the /dev/ page itself."
url: "{{agentUrl}}/api/agent/status"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
